# Render.com Blueprint — lets you deploy the backend with "New + Blueprint"
# pointing at this repo, instead of configuring each field by hand.
# See backend/README section in the root README for the manual steps too.
services:
  - type: web
    name: krishi-sahayak-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
